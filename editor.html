<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Editor · MeuDesigner</title>
<link rel="icon" type="image/png" href="/assets/brand/icon.png">
<link rel="stylesheet" href="/assets/fonts/fonts.css">
<link rel="stylesheet" href="/assets/auth.css">
<style>
  body{overflow:hidden;}
  .ed{display:grid;grid-template-columns:120px 1fr 320px;height:100vh;}
  .ed-top{grid-column:1/-1;display:flex;align-items:center;justify-content:space-between;gap:14px;padding:10px 18px;background:rgba(245,241,234,.96);border-bottom:3px solid var(--ink);}
  .ed-top .l{display:flex;align-items:center;gap:14px;min-width:0;}
  .ed-top .back{font-family:var(--mono);font-size:12px;color:var(--ink-3);cursor:pointer;background:none;border:none;}
  .ed-top .back:hover{color:var(--deep);}
  .ed-top .ttl{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:44vw;}
  .ed-top .ttl small{display:block;font-family:var(--mono);font-weight:400;font-size:11px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .ed-top .r{display:flex;align-items:center;gap:10px;}
  .rail{border-right:2px solid var(--ink);background:var(--surface-2);overflow-y:auto;padding:12px 10px;display:flex;flex-direction:column;gap:10px;}
  .thumb{position:relative;border:2px solid var(--ink);border-radius:8px;overflow:hidden;cursor:pointer;background:#fff;box-shadow:2px 2px 0 var(--ink);line-height:0;}
  .thumb.on{outline:3px solid var(--green);outline-offset:1px;}
  .thumb canvas{width:100%;display:block;}
  .thumb .n{position:absolute;top:4px;left:5px;font-family:var(--mono);font-size:10px;font-weight:700;color:#fff;background:rgba(20,24,29,.72);border-radius:4px;padding:1px 5px;z-index:2;}
  .thumb .del{position:absolute;top:3px;right:3px;width:18px;height:18px;border-radius:50%;background:#fff;border:1.5px solid var(--ink);font-size:11px;line-height:1;cursor:pointer;display:none;z-index:2;}
  .thumb:hover .del{display:block;}
  .rail .addslide{border:2px dashed var(--ink-3);border-radius:8px;color:var(--ink-2);background:none;cursor:pointer;font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:12px;padding:10px;}
  .rail .addslide:hover{border-color:var(--green);color:var(--deep);}
  .stage{display:flex;align-items:center;justify-content:center;background:repeating-conic-gradient(#E7E0D2 0% 25%, #EFEAE0 0% 50%) 50%/26px 26px;overflow:auto;position:relative;padding:20px;}
  .stage-nav{position:absolute;top:50%;transform:translateY(-50%);width:44px;height:44px;border-radius:50%;background:var(--paper);border:2px solid var(--ink);box-shadow:2px 2px 0 var(--ink);cursor:pointer;font-size:22px;display:flex;align-items:center;justify-content:center;z-index:5;}
  .stage-nav:hover{background:var(--green);}
  .stage-nav.prev{left:14px;} .stage-nav.next{right:14px;}
  .stage-nav[disabled]{opacity:.35;cursor:default;}
  .frame{box-shadow:0 14px 46px rgba(20,24,29,.32);border-radius:14px;overflow:hidden;line-height:0;position:relative;}
  .frame canvas{display:block;}
  .cover-badge{position:absolute;top:12px;left:12px;z-index:3;background:rgba(20,24,29,.8);color:#fff;font-family:var(--mono);font-size:11px;font-weight:700;padding:5px 10px;border-radius:20px;display:none;align-items:center;gap:7px;}
  .cover-badge.show{display:inline-flex;}
  .cover-badge .spin{width:12px;height:12px;border-width:2px;border-top-color:#fff;border-color:rgba(255,255,255,.35);display:inline-block;}
  .panel{border-left:2px solid var(--ink);background:var(--cream);overflow-y:auto;padding:16px 16px 40px;}
  .panel h3{font-size:12px;font-family:var(--mono);text-transform:uppercase;letter-spacing:.1em;color:var(--ink-3);margin:18px 0 10px;}
  .panel h3:first-child{margin-top:2px;}
  .panel .fld{display:block;font-size:12px;font-weight:600;color:var(--ink);margin:12px 0 6px;font-family:'Space Grotesk',sans-serif;}
  .panel input[type=text],.panel textarea,.panel select{width:100%;border:2px solid var(--ink);border-radius:8px;padding:9px 11px;font-family:inherit;font-size:14px;background:var(--paper);box-shadow:2px 2px 0 var(--ink);resize:vertical;}
  .panel input:focus,.panel textarea:focus{outline:none;border-color:var(--green);box-shadow:3px 3px 0 var(--green);}
  .panel .mini-hint{font-size:11px;color:var(--ink-3);margin-top:5px;line-height:1.4;}
  .swatches{display:flex;gap:8px;flex-wrap:wrap;}
  .sw{width:30px;height:30px;border-radius:7px;border:2px solid var(--ink);cursor:pointer;box-shadow:2px 2px 0 var(--ink);}
  .sw.on{outline:3px solid var(--ink);outline-offset:2px;}
  .regen{width:100%;margin-top:6px;}
  /* overlay de geração */
  .genov{position:fixed;inset:0;background:var(--dark);color:var(--cream);z-index:80;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:30px;}
  .genlogo{display:flex;align-items:center;gap:12px;margin-bottom:34px;}
  .genlogo img{height:42px;}
  .genlogo .wm{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:26px;letter-spacing:-.02em;color:var(--cream);}
  .genlogo .wm b{color:var(--green);}
  .genov h2{font-size:24px;color:var(--cream);margin-bottom:8px;}
  .genov p{color:var(--dark-mut);font-family:var(--mono);font-size:13px;}
  /* bonequinho correndo */
  .gen-run{position:relative;width:150px;height:112px;margin:0 auto 30px;}
  .runner{position:absolute;left:50px;top:6px;width:52px;height:82px;animation:bob .48s ease-in-out infinite;}
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
  .runner span{position:absolute;background:var(--green);border-radius:5px;}
  .runner .head{top:0;left:16px;width:20px;height:20px;border-radius:50%;}
  .runner .body{top:17px;left:22px;width:7px;height:33px;transform:rotate(12deg);transform-origin:top center;}
  .runner .arm{top:23px;left:22px;width:6px;height:22px;background:var(--green-2);transform-origin:top center;}
  .runner .arm-a{animation:arm .48s linear infinite;}
  .runner .arm-b{animation:arm .48s linear infinite;animation-delay:-.24s;}
  @keyframes arm{0%{transform:rotate(-48deg)}50%{transform:rotate(48deg)}100%{transform:rotate(-48deg)}}
  .runner .leg{top:48px;left:22px;width:7px;height:24px;transform-origin:top center;}
  .runner .leg .shin{top:21px;left:0;width:7px;height:24px;background:var(--green);transform-origin:top center;}
  .runner .leg-a{animation:thigh .48s linear infinite;}
  .runner .leg-a .shin{animation:shin .48s linear infinite;}
  .runner .leg-b{animation:thigh .48s linear infinite;animation-delay:-.24s;}
  .runner .leg-b .shin{animation:shin .48s linear infinite;animation-delay:-.24s;}
  @keyframes thigh{0%{transform:rotate(40deg)}25%{transform:rotate(2deg)}50%{transform:rotate(-34deg)}75%{transform:rotate(-6deg)}100%{transform:rotate(40deg)}}
  @keyframes shin{0%{transform:rotate(-6deg)}25%{transform:rotate(-58deg)}50%{transform:rotate(-16deg)}75%{transform:rotate(-74deg)}100%{transform:rotate(-6deg)}}
  .ground{position:absolute;left:0;bottom:12px;width:150px;height:6px;}
  .ground i{position:absolute;bottom:0;height:5px;width:26px;border-radius:3px;background:rgba(127,224,176,.45);animation:dash .48s linear infinite;}
  .ground i:nth-child(1){left:120px;}
  .ground i:nth-child(2){left:64px;animation-delay:-.16s;}
  .ground i:nth-child(3){left:14px;animation-delay:-.32s;}
  @keyframes dash{0%{transform:translateX(12px);opacity:0}20%{opacity:1}100%{transform:translateX(-140px);opacity:0}}
  @media(max-width:900px){ .ed{grid-template-columns:1fr;} .rail,.panel{display:none;} }
</style>
</head>
<body>
<div id="guard" class="route-guard"><span class="spin"></span></div>

<div class="genov" id="genov" style="display:none">
  <div class="genlogo"><img src="/assets/brand/mark.png" alt=""><span class="wm">Meu<b>Designer</b></span></div>
  <div class="gen-run" aria-hidden="true">
    <div class="runner">
      <span class="head"></span>
      <span class="body"></span>
      <span class="arm arm-a"></span>
      <span class="arm arm-b"></span>
      <span class="leg leg-a"><span class="shin"></span></span>
      <span class="leg leg-b"><span class="shin"></span></span>
    </div>
    <div class="ground"><i></i><i></i><i></i></div>
  </div>
  <h2 id="genTitle">Gerando seu carrossel...</h2>
  <p id="genStep">Escrevendo o roteiro com IA</p>
</div>

<div class="ed" id="shell" style="display:none">
  <div class="ed-top">
    <div class="l">
      <button class="back" id="back">← Voltar</button>
      <div class="ttl"><span id="tName">—</span><small id="tTema">—</small></div>
    </div>
    <div class="r">
      <button class="btn btn-google btn-sm" id="saveBtn" style="width:auto"><span class="btn-label">Salvar</span></button>
      <button class="btn btn-primary btn-sm" id="dlBtn" style="width:auto"><span class="spin"></span><span class="btn-label">⤓ Baixar PNGs</span></button>
    </div>
  </div>

  <div class="rail" id="rail"></div>

  <div class="stage">
    <button class="stage-nav prev" id="prev" aria-label="Anterior">‹</button>
    <div class="frame" id="frame">
      <div class="cover-badge" id="coverBadge"><span class="spin"></span> gerando capa…</div>
    </div>
    <button class="stage-nav next" id="next" aria-label="Próximo">›</button>
  </div>

  <div class="panel">
    <h3>Editar este slide</h3>
    <div id="fields"></div>
    <h3>Cor de destaque</h3>
    <div class="swatches" id="swatches"></div>
    <h3>Capa</h3>
    <button class="btn btn-google btn-sm regen" id="regenBtn"><span class="btn-label">↻ Gerar outra capa</span></button>
    <div class="mini-hint">A capa é uma foto criada por IA no clima do template. Gere de novo se quiser outra.</div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/supabase-config.js"></script>
<script src="/auth.js"></script>
<script>
(function(){
  var A = window.MDAuth;
  var params = new URLSearchParams(location.search);
  var brief = {}; try{ brief = JSON.parse(sessionStorage.getItem('md_brief')||'{}'); }catch(_){}
  var opened = null; try{ opened = JSON.parse(sessionStorage.getItem('md_open')||'null'); }catch(_){}
  var src = (opened && opened.slides) ? opened : brief;
  var tplId = params.get('tpl') || src.tpl || 'post-social';
  var tplNome = src.nome || 'Post / Rede Social';
  var tema = src.tema || 'Meu primeiro carrossel';

  // ---- design por template (acento, fonte, badge, cena da capa) ----
  var TPL = {
    'post-social':{acc:'#33B589',font:'sans',badge:'SOCIAL',scene:'retrato de jovem criador de conteudo sorrindo, gravando com o celular em um setup moderno e bem iluminado'},
    'insider':{acc:'#F2A93B',font:'sans',badge:'INSIDER',scene:'retrato de empreendedor confiante de camisa, sentado em escritorio moderno com laptop, luz quente ao entardecer'},
    'advocacia':{acc:'#C9A24B',font:'serif',badge:'DIREITO',scene:'retrato de advogado de terno sobrio em escritorio classico, estante de livros juridicos ao fundo, iluminacao cinematografica'},
    'noticias-virais':{acc:'#E5484D',font:'sans',badge:'VIRAL',scene:'cena urbana noturna dramatica de uma grande cidade, luzes e movimento, clima de manchete urgente'},
    'marketing':{acc:'#8B5CF6',font:'sans',badge:'MARKETING',scene:'profissional de marketing analisando graficos de performance em telas, escritorio criativo moderno com detalhes em roxo'},
    'ia':{acc:'#22D3EE',font:'sans',badge:'IA',scene:'representacao abstrata de inteligencia artificial, rede neural futurista com luz azul ciano brilhante'},
    'imobiliaria':{acc:'#3B82F6',font:'sans',badge:'IMOVEIS',scene:'sala de estar de casa moderna de alto padrao, arquitetura sofisticada e luz natural ao entardecer'},
    'nutricionista':{acc:'#34C759',font:'sans',badge:'NUTRICAO',scene:'retrato de nutricionista sorridente de jaleco segurando um prato de salada colorida, cozinha clara e saudavel'},
    'medicos':{acc:'#2E9BE6',font:'sans',badge:'SAUDE',scene:'retrato de medico de jaleco branco com estetoscopio em corredor de hospital moderno e limpo'},
    'educacao':{acc:'#F59E0B',font:'serif',badge:'EDUCACAO',scene:'retrato de professor experiente em uma biblioteca aconchegante cheia de livros, clima academico'},
    'clinica-estetica':{acc:'#EC4899',font:'sans',badge:'ESTETICA',scene:'ambiente sofisticado de clinica de estetica, tons de rosa e branco, elegante e clean'},
    'contabilidade':{acc:'#0EA5A0',font:'sans',badge:'FINANCAS',scene:'retrato de contador de terno revisando graficos financeiros em um escritorio corporativo elegante'},
    'academia':{acc:'#EF4444',font:'sans',badge:'FITNESS',scene:'retrato de atleta musculoso treinando com pesos em academia moderna com iluminacao dramatica'},
    'turismo':{acc:'#06B6D4',font:'sans',badge:'TURISMO',scene:'praia paradisiaca tropical com aguas azul-turquesa cristalinas e areia branca, ceu limpo'},
    'beleza':{acc:'#D946EF',font:'serif',badge:'BELEZA',scene:'salao de beleza elegante e sofisticado com iluminacao suave e dourada'},
    'categoria':{acc:'#F2A93B',font:'sans',badge:'NOTICIAS',scene:'cena de redacao de noticias moderna, clima de reportagem seria e profissional'},
    'dentistas':{acc:'#06B6D4',font:'sans',badge:'ODONTO',scene:'consultorio odontologico moderno impecavelmente branco, ambiente clean e acolhedor'},
    'joias':{acc:'#C9A24B',font:'serif',badge:'JOIAS',scene:'aneis e joias de ouro e diamantes brilhando sobre veludo escuro, luz de estudio elegante'},
    'pets':{acc:'#F97316',font:'sans',badge:'PETS',scene:'cachorro golden retriever fofo e feliz em um ambiente aconchegante e bem iluminado'}
  };
  function tpl(){ return TPL[tplId] || {acc:'#33B589',font:'sans',badge:'SOCIAL',scene:'cena profissional moderna'}; }

  var state = { acc: tpl().acc, idx:0, slides:[] };
  var coverImg=null, coverReady=false;

  // ---- esqueleto (fallback se a IA falhar) ----
  function skeleton(){
    var t=tema.trim(), n=4, m=t.match(/\b([2-9]|10)\b/); if(m) n=Math.min(parseInt(m[1],10),6);
    var s=[{role:'cover',kick:tpl().badge,title:t||'Seu tema aqui',body:'Deslize para ver →'}];
    for(var i=1;i<=n;i++) s.push({role:'content',kick:'Ponto '+i,title:'Título do ponto '+i,body:'Escreva aqui o conteúdo do slide '+i+'.'});
    s.push({role:'cta',kick:'Bora',title:'Gostou? Salva e compartilha.',body:'Me segue pra mais.',cta:'@seu.perfil'});
    return s;
  }
  async function genText(){
    try{
      if(A.configured && A.sb){
        var r = await A.sb.functions.invoke('gerar-carrossel', { body:{ tema:tema, template:tplNome, n:5 } });
        if(!r.error && r.data && Array.isArray(r.data.slides) && r.data.slides.length)
          return r.data.slides.map(function(s){ return {role:s.role||'content',kick:s.kick||'',title:s.title||'',body:s.body||'',cta:s.cta}; });
        if(r.data && r.data.error) console.warn('IA texto:', r.data.error);
      }
    }catch(e){ console.warn('IA texto falhou:', e.message); }
    return skeleton();
  }
  async function genCover(){
    coverReady=false; document.getElementById('coverBadge').classList.add('show'); renderStage();
    try{
      if(A.configured && A.sb){
        var r = await A.sb.functions.invoke('gerar-capa', { body:{ scene:tpl().scene, tema:tema } });
        if(!r.error && r.data && r.data.b64){
          await new Promise(function(res){ var im=new Image(); im.onload=function(){ coverImg=im; coverReady=true; res(); }; im.onerror=function(){res();}; im.src='data:image/png;base64,'+r.data.b64; });
        } else if(r.data && r.data.error) console.warn('IA capa:', r.data.error);
      }
    }catch(e){ console.warn('IA capa falhou:', e.message); }
    document.getElementById('coverBadge').classList.remove('show');
    renderStage(); renderRail();
  }

  // ================= RENDERER (Canvas, estilo CarrosseIA por template) =================
  function hx(hex,i){ return parseInt(hex.replace('#','').substr(i,2),16); }
  function rgba(hex,a){ return 'rgba('+hx(hex,0)+','+hx(hex,2)+','+hx(hex,4)+','+a+')'; }
  function shade(hex,amt){ function cl(v){return Math.max(0,Math.min(255,v));} return 'rgb('+cl(hx(hex,0)+amt)+','+cl(hx(hex,2)+amt)+','+cl(hx(hex,4)+amt)+')'; }
  function famHead(){ return tpl().font==='serif' ? 'Georgia, "Times New Roman", serif' : '"Space Grotesk", sans-serif'; }
  function roundRect(ctx,x,y,w,h,r){ ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath(); }
  function wrap(ctx,text,maxW){ var w=(text||'').split(/\s+/),L=[],c=''; for(var i=0;i<w.length;i++){var t=c?c+' '+w[i]:w[i]; if(c&&ctx.measureText(t).width>maxW){L.push(c);c=w[i];}else c=t;} if(c)L.push(c); return L.length?L:['']; }
  function tsize(txt,cover){ var L=(txt||'').length; if(cover) return L>78?54:L>50?66:L>30?80:92; return L>78?52:L>50?60:70; }
  function badge(ctx,label,acc){ var W=1080; ctx.font='700 24px "JetBrains Mono", monospace'; var tw=ctx.measureText(label).width,pw=tw+46,ph=50,x=W-72-pw,y=64; ctx.fillStyle=acc; roundRect(ctx,x,y,pw,ph,13); ctx.fill(); ctx.fillStyle='#12100E'; ctx.textAlign='left'; ctx.textBaseline='middle'; ctx.fillText(label,x+23,y+ph/2+1); ctx.textBaseline='alphabetic'; }
  function drawRich(ctx,text,x,y,maxW,lh,base,acc,size){
    var parts=[],re=/\*\*(.+?)\*\*/g,last=0,m;
    while((m=re.exec(text))){ if(m.index>last)parts.push({t:text.slice(last,m.index),h:false}); parts.push({t:m[1],h:true}); last=re.lastIndex; }
    if(last<text.length)parts.push({t:text.slice(last),h:false});
    var words=[]; parts.forEach(function(p){ p.t.split(/(\s+)/).forEach(function(w){ if(w.length)words.push({w:w,h:p.h}); }); });
    var cx=x,cy=y; ctx.textAlign='left';
    words.forEach(function(o){ ctx.font=(o.h?'700 ':'400 ')+size+'px Inter'; var ww=ctx.measureText(o.w).width; if(o.w.trim()!==''&&cx+ww>x+maxW){cx=x;cy+=lh;} ctx.fillStyle=o.h?acc:base; ctx.fillText(o.w,cx,cy); cx+=ww; });
    return cy;
  }
  function footer(ctx,i,n,acc,dark){
    var W=1080,y=1276,pad=72,col=dark?'#fff':'#8A857C';
    ctx.textAlign='left'; ctx.fillStyle=col; ctx.font='400 28px "JetBrains Mono", monospace';
    ctx.fillText(('0'+(i+1)).slice(-2)+'/'+('0'+n).slice(-2),pad,y);
    var dw=16,gap=11,tot=n*dw+(n-1)*gap,sx=(W-tot)/2;
    for(var k=0;k<n;k++){ var dx=sx+k*(dw+gap); if(k===i){ctx.save();ctx.translate(dx+dw/2,y-9);ctx.rotate(Math.PI/4);ctx.fillStyle=acc;ctx.fillRect(-7,-7,14,14);ctx.restore();} else {ctx.fillStyle=dark?'rgba(255,255,255,.4)':'rgba(26,23,20,.22)';ctx.fillRect(dx,y-16,dw,14);} }
    ctx.textAlign='right'; ctx.fillStyle=col; ctx.font='700 27px '+famHead(); ctx.fillText('ARRASTA →',W-pad,y); ctx.textAlign='left';
  }
  function drawSlide(s,i,n){
    var W=1080,H=1350,c=document.createElement('canvas'); c.width=W;c.height=H; var ctx=c.getContext('2d');
    var t=tpl(),acc=state.acc||t.acc,role=s.role||'content',pad=72,maxW=W-pad*2;
    if(role==='cover'){
      if(coverImg&&coverReady){ var iw=coverImg.width,ih=coverImg.height,r=Math.max(W/iw,H/ih),dw=iw*r,dh=ih*r; ctx.drawImage(coverImg,(W-dw)/2,(H-dh)/2,dw,dh); }
      else { var g=ctx.createLinearGradient(0,0,W,H); g.addColorStop(0,shade(acc,-25)); g.addColorStop(1,'#0d1117'); ctx.fillStyle=g; ctx.fillRect(0,0,W,H); }
      var sc=ctx.createLinearGradient(0,H*0.34,0,H); sc.addColorStop(0,'rgba(9,11,15,0)'); sc.addColorStop(1,'rgba(9,11,15,.93)'); ctx.fillStyle=sc; ctx.fillRect(0,0,W,H);
      ctx.fillStyle='rgba(9,11,15,.28)'; ctx.fillRect(0,0,W,210);
      badge(ctx,t.badge,acc);
      var hs=tsize(s.title,true); ctx.font='700 '+hs+'px '+famHead(); var tl=wrap(ctx,s.title,maxW);
      ctx.font='400 38px Inter'; var sl=s.body?wrap(ctx,s.body,maxW):[]; var lhT=hs*1.05,lhS=52;
      var bottom=1186, bh=tl.length*lhT+(sl.length?20+sl.length*lhS:0), y=bottom-bh;
      ctx.fillStyle='#fff'; ctx.font='700 '+hs+'px '+famHead(); ctx.textAlign='left';
      tl.forEach(function(ln){ y+=hs; ctx.fillText(ln,pad,y); y+=lhT-hs; });
      if(sl.length){ y+=20; ctx.fillStyle='rgba(255,255,255,.86)'; ctx.font='400 38px Inter'; sl.forEach(function(ln){ y+=38; ctx.fillText(ln,pad,y); y+=lhS-38; }); }
      footer(ctx,i,n,acc,true);
    } else if(role==='cta'){
      ctx.fillStyle='#14181d'; ctx.fillRect(0,0,W,H);
      var gg=ctx.createRadialGradient(W*0.8,H*0.22,0,W*0.8,H*0.22,W*0.75); gg.addColorStop(0,rgba(acc,0.22)); gg.addColorStop(1,rgba(acc,0)); ctx.fillStyle=gg; ctx.fillRect(0,0,W,H);
      badge(ctx,(s.kick||'BORA').toUpperCase().slice(0,14),acc);
      var hs2=tsize(s.title,true); ctx.font='700 '+hs2+'px '+famHead(); ctx.fillStyle='#fff'; ctx.textAlign='left';
      var tl2=wrap(ctx,s.title,maxW),y2=470; tl2.forEach(function(ln){ y2+=hs2; ctx.fillText(ln,pad,y2); y2+=hs2*0.08; });
      if(s.body){ y2+=22; ctx.font='400 40px Inter'; ctx.fillStyle='rgba(255,255,255,.8)'; wrap(ctx,s.body,maxW).forEach(function(ln){ y2+=40; ctx.fillText(ln,pad,y2); y2+=18; }); }
      y2+=48; var ct=s.cta||'@seu.perfil'; ctx.font='700 46px '+famHead(); var cw=ctx.measureText(ct).width+96;
      ctx.fillStyle=acc; roundRect(ctx,pad,y2,cw,104,18); ctx.fill(); ctx.fillStyle='#12100E'; ctx.textBaseline='middle'; ctx.fillText(ct,pad+48,y2+56); ctx.textBaseline='alphabetic';
      footer(ctx,i,n,acc,true);
    } else {
      ctx.fillStyle='#FBFAF6'; ctx.fillRect(0,0,W,H);
      badge(ctx,(s.kick||t.badge).toUpperCase().slice(0,16),acc);
      var hs3=tsize(s.title,false); ctx.font='700 '+hs3+'px '+famHead(); ctx.fillStyle='#1A1714'; ctx.textAlign='left';
      var tl3=wrap(ctx,s.title,maxW),y3=290; tl3.forEach(function(ln){ y3+=hs3; ctx.fillText(ln,pad,y3); y3+=hs3*0.08; });
      y3+=8; ctx.fillStyle=acc; ctx.fillRect(pad,y3,92,9); y3+=64;
      drawRich(ctx,s.body||'',pad,y3+42,maxW,60,'#3a352e',acc,42);
      footer(ctx,i,n,acc,false);
    }
    return c;
  }

  // ================= UI =================
  function fit(){ var st=document.querySelector('.stage'); return Math.min((st.clientHeight-44)/1350,(st.clientWidth-130)/1080,0.62); }
  function renderStage(){
    var frame=document.getElementById('frame'); var badge=document.getElementById('coverBadge');
    var c=drawSlide(state.slides[state.idx],state.idx,state.slides.length); var sc=fit();
    c.style.width=(1080*sc)+'px'; c.style.height=(1350*sc)+'px';
    frame.querySelectorAll('canvas').forEach(function(x){x.remove()}); frame.appendChild(c);
    document.getElementById('prev').disabled=state.idx===0; document.getElementById('next').disabled=state.idx===state.slides.length-1;
  }
  function renderRail(){
    var rail=document.getElementById('rail'); rail.innerHTML='';
    state.slides.forEach(function(s,i){
      var t=document.createElement('div'); t.className='thumb'+(i===state.idx?' on':'');
      var c=drawSlide(s,i,state.slides.length); c.style.width='100%';
      t.innerHTML='<span class="n">'+(i+1)+'</span>';
      if(state.slides.length>1){ var d=document.createElement('button'); d.className='del'; d.textContent='×'; d.onclick=function(e){e.stopPropagation();state.slides.splice(i,1);if(state.idx>=state.slides.length)state.idx=state.slides.length-1;renderAll();}; t.appendChild(d); }
      t.appendChild(c);
      t.onclick=function(){ state.idx=i; renderAll(); };
      rail.appendChild(t);
    });
    var add=document.createElement('button'); add.className='addslide'; add.textContent='+ slide';
    add.onclick=function(){ state.slides.splice(state.idx+1,0,{role:'content',kick:'Ponto',title:'Novo slide',body:'Escreva aqui...'}); state.idx++; renderAll(); };
    rail.appendChild(add);
  }
  function renderFields(){
    var s=state.slides[state.idx], box=document.getElementById('fields'); box.innerHTML='';
    function field(label,key,ta){
      var l=document.createElement('label'); l.className='fld'; l.textContent=label; box.appendChild(l);
      var el=document.createElement(ta?'textarea':'input'); if(!ta)el.type='text'; if(ta)el.rows=ta;
      el.value=s[key]||''; el.oninput=function(){ s[key]=el.value; renderStage(); updateThumb(state.idx); };
      box.appendChild(el);
    }
    field('Chamada (kicker)','kick',0);
    field('Título','title',2);
    field('Texto','body',3);
    if(s.role==='cta') field('CTA (perfil)','cta',0);
  }
  function updateThumb(i){
    var thumbs=document.querySelectorAll('.thumb'); if(!thumbs[i])return;
    var old=thumbs[i].querySelector('canvas'); if(!old)return;
    var c=drawSlide(state.slides[i],i,state.slides.length); c.style.width='100%'; old.replaceWith(c);
  }
  function renderAll(){ renderStage(); renderRail(); renderFields(); }
  function renderSwatches(){
    var box=document.getElementById('swatches'); box.innerHTML='';
    [tpl().acc,'#33B589','#F2A93B','#E5484D','#8B5CF6','#22D3EE','#3B82F6','#EC4899','#C9A24B'].filter(function(v,i,a){return a.indexOf(v)===i;}).forEach(function(c){
      var s=document.createElement('div'); s.className='sw'+(c===state.acc?' on':''); s.style.background=c;
      s.onclick=function(){ state.acc=c; renderAll(); };
      box.appendChild(s);
    });
  }

  // export
  async function download(){
    var btn=document.getElementById('dlBtn'); btn.classList.add('is-loading'); btn.disabled=true;
    try{ var zip=new JSZip(); await document.fonts.ready;
      for(var i=0;i<state.slides.length;i++){ var c=drawSlide(state.slides[i],i,state.slides.length); zip.file('slide-'+(i+1)+'.png', c.toDataURL('image/png').split(',')[1], {base64:true}); }
      var blob=await zip.generateAsync({type:'blob'}); var a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='meudesigner-carrossel.zip'; a.click(); setTimeout(function(){URL.revokeObjectURL(a.href)},4000);
    }catch(e){ alert('Erro ao exportar: '+e.message); }
    btn.classList.remove('is-loading'); btn.disabled=false;
  }
  async function save(){
    var btn=document.getElementById('saveBtn'),lab=btn.querySelector('.btn-label'),old=lab.textContent; lab.textContent='Salvando...';
    try{ var s=await A.getSession(); if(!s){location.href='/login.html';return;} await A.sb.from('carousels').insert({user_id:s.user.id,template:tplId,tema:tema,slides:state.slides}); lab.textContent='Salvo ✓'; }
    catch(e){ lab.textContent='Erro'; console.error(e); }
    setTimeout(function(){ lab.textContent=old; },1800);
  }

  document.getElementById('prev').onclick=function(){ if(state.idx>0){state.idx--;renderAll();} };
  document.getElementById('next').onclick=function(){ if(state.idx<state.slides.length-1){state.idx++;renderAll();} };
  document.getElementById('back').onclick=function(){ location.href='/app.html'; };
  document.getElementById('dlBtn').onclick=download;
  document.getElementById('saveBtn').onclick=save;
  document.getElementById('regenBtn').onclick=async function(){
    if(A.configured && A.sb){
      try{
        var r=await A.sb.rpc('consumir_creditos',{p_qtd:3});
        var row=r.data&&r.data[0];
        if(r.error||!row){ alert('Erro ao verificar créditos.'); return; }
        if(!row.ok){ alert('Créditos insuficientes ('+row.saldo+'). Uma nova capa custa 3.'); return; }
      }catch(e){ alert('Erro: '+e.message); return; }
    }
    genCover();
  };
  window.addEventListener('resize', renderStage);

  function setStep(txt){ var e=document.getElementById('genStep'); if(e)e.textContent=txt; }
  (async function(){
    if(A.configured){ var u=await A.requireAuth(); if(!u) return; }
    document.getElementById('tName').textContent=tplNome;
    document.getElementById('tTema').textContent=tema.length>64?tema.slice(0,64)+'…':tema;
    document.getElementById('guard').style.display='none';
    document.getElementById('genov').style.display='flex';
    await document.fonts.ready;
    if(opened && opened.slides && opened.slides.length){
      // reabrindo projeto salvo: não gera texto nem cobra; capa fica no fundo do template (regenerável)
      state.slides = opened.slides;
      sessionStorage.removeItem('md_open');
      renderSwatches(); renderAll();
      document.getElementById('genov').style.display='none';
      document.getElementById('shell').style.display='grid';
      setTimeout(renderStage,60);
    } else {
      setStep('Escrevendo o roteiro com IA…');
      state.slides = await genText();
      renderSwatches(); renderAll();
      document.getElementById('genov').style.display='none';
      document.getElementById('shell').style.display='grid';
      setTimeout(renderStage,60);
      genCover(); // capa por IA em background (já paga no custo do carrossel)
    }
  })();
})();
</script>
</body>
